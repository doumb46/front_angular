<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <mat-card-title>Connexion</mat-card-title>
        <mat-card-subtitle>Application de gestion des Assignments — ESATIC</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content>
      @if(erreur()) {
        <div class="erreur-bloc">
          <mat-icon>error_outline</mat-icon>
          <span>{{ erreur() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput
                 [ngModel]="loginVal()"
                 (ngModelChange)="loginVal.set($event)"
                 name="login"
                 placeholder="ex: admin"
                 autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput
                 [type]="hidePass() ? 'password' : 'text'"
                 [ngModel]="passwordVal()"
                 (ngModelChange)="passwordVal.set($event)"
                 name="password"
                 autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePass.set(!hidePass())">
            <mat-icon>{{ hidePass() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit"
                class="full-width submit-btn"
                [disabled]="loading()">
          @if(loading()) { Connexion en cours... }
          @else { Se connecter }
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="hint">
        <mat-icon>info</mat-icon>
        Compte admin : <strong>admin</strong> / <strong>admin123</strong> &nbsp;|&nbsp;
        Compte user :&nbsp; <strong>user1</strong> / <strong>user123</strong>
      </p>
    </mat-card-footer>
  </mat-card>
</div>
